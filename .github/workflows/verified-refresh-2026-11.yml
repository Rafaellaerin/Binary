name: Verified one-shot complete binary refresh (2026-11-01)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verified-refresh-2026-11.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: complete-binary-refresh
  cancel-in-progress: false

jobs:
  verify-and-publish:
    name: Verify all publisher assets before replacing any executable
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout repository and actual Git LFS binaries
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true

      - name: Check LFS integrity
        run: git lfs fsck --objects

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Check trusted downloader and audit code
        run: |
          python -m py_compile .github/workflows/scripts/download_binaries.py security/refresh_verified_snapshot.py security/check_binary_inventory.py security/audit_all_binaries.py
          python -m unittest discover -s security -p 'test_*.py' -v

      - name: Stage all 51 original upstream executables with mandatory publisher SHA-256
        env:
          YT_DLP_VERSION: '2026.10.26'
          GITHUB_TOKEN: ${{ github.token }}
          VELORA_GITHUB_TOKEN: ${{ secrets.VELORA_RELEASES_TOKEN || github.token }}
        run: python security/refresh_verified_snapshot.py

      - name: Audit all committed executables, formats, and pinned upstream release bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VELORA_GITHUB_TOKEN: ${{ secrets.VELORA_RELEASES_TOKEN || github.token }}
        run: |
          python security/audit_snapshot.py --strict
          python security/audit_all_binaries.py --enforce

      - name: Generate and immediately verify SHA-256 of every executable
        run: |
          python security/check_binary_inventory.py --write
          python security/check_binary_inventory.py --check

      - name: Commit only fully validated binary snapshot directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install --local
          git add .gitattributes binaries binary_paths.json security/SHA256SUMS.txt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes: all 51 executables already match upstream."
            exit 0
          fi
          git commit -m "chore(security): verified 51-binary upstream refresh, yt-dlp 2026.10.26, SHA-256 inventory"
          git push origin HEAD:main
          echo "### SHA-256-verified publisher snapshot committed to main" >> "$GITHUB_STEP_SUMMARY"
